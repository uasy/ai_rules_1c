# Adapter: Claude Code
#
# Describes how to copy and adapt files from content/ for Claude Code.
# Read by both installation channels (AI-agent installer and install.ps1).
#
# Schema: closed adapter schema described in AGENT-INSTALL.md (Lean placement)
# and implemented by install.ps1.
# Notes:
#   - Rules are placed under .claude/rules-1c/ — deliberately NOT .claude/rules/:
#     Claude Code (v2.0.64+) auto-loads every .md under .claude/rules/ without
#     `paths` frontmatter into context at session start, which would make the
#     whole on-demand set always-on (~130k tokens per request). The non-standard
#     directory keeps lazy loading intact — AGENTS.md references resolve by
#     file name, and the agent reads a rule only when it is actually needed.
#   - Slash-command frontmatter fields use hyphen-separated names natively.
#   - Skills follow the Anthropic SKILL.md standard and are copied verbatim.
#   - A minimal CLAUDE.md is generated as an entry point pointing to AGENTS.md.

tool: claude-code
schemaVersion: 1

detection:
  - exists: ".claude/"
  - exists: "CLAUDE.md"

rules:
  copyTo: ".claude/rules-1c/{name}.md"
  frontmatter:
    keep: [description, alwaysApply]
    drop: [globs, category]

agents:
  copyTo: ".claude/agents/{name}.md"
  frontmatter:
    # `tools` is dropped: the source arrays use the neutral names `Shell` and
    # `MCP`, which are not Claude Code tool names (`Bash`, and MCP tools are
    # addressed individually as `mcp__<server>__<tool>`). Writing them through
    # verbatim yields a frontmatter Claude Code cannot resolve, so the agent
    # ends up without the tools its prompt relies on. Dropping the key lets the
    # agent inherit the parent tool set (equivalent to `tools: "*"`), the same
    # resolution command-code.yaml uses.
    keep: [name, description, modelHint, isSubagent, allowParallel]
    rename:
      modelHint: model
    drop: [tools, reasoningEffort]

commands:
  copyTo: ".claude/commands/{name}.md"
  frontmatter:
    keep: [description, argumentHint, allowedTools]
    rename:
      argumentHint: argument-hint
      allowedTools: allowed-tools

skills:
  copyTo: ".claude/skills/{name}/"
  mode: verbatim

mcp:
  source: "content/mcp-servers.json"
  target: ".mcp.json"
  schema: mcpServers
  format: json

entry:
  target: "CLAUDE.md"
  template: "See @AGENTS.md for project instructions.\n"
